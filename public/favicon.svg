<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Lingkaran Dark Cosmic -->
  <circle cx="50" cy="50" r="48" fill="#120a2a" stroke="#f472b6" stroke-width="2" />
  
  <!-- Glow Outer Effect -->
  <circle cx="50" cy="50" r="30" fill="#fef3c7" opacity="0.15" filter="blur(5px)" />
  
  <!-- Bintang Magis Emas (✦ Whimsical Sparkle) -->
  <path d="M50 12 C50 35 65 50 88 50 C65 50 50 65 50 88 C50 65 35 50 12 50 C35 50 50 35 50 12 Z" fill="url(#grad)" />
  
  <!-- Small Sparkle Dots -->
  <circle cx="78" cy="22" r="3" fill="#f472b6" />
  <circle cx="22" cy="78" r="2" fill="#fbbf24" />

  <!-- Gradient Color Emas ke Pink -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
  </defs>
</svg>
